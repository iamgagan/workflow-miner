name: CI

on:
  push:
    branches: [main, workflow-miner]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build engine
        run: pnpm --filter @workflow-miner/engine build

      - name: Build web
        run: pnpm --filter web build
        env:
          # Build-time env stubs — runtime values set in Vercel.
          # The lazy-init pattern means absent vars don't crash the build.
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          OPENAI_API_KEY: stub

      - name: Test web
        run: pnpm --filter web test

      - name: Build mcp-server
        run: pnpm --filter @workflow-miner/mcp build
